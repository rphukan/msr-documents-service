spring:
  profiles: local
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 3KB
      max-file-size: 2MB
      max-request-size: 20MB
      location: ${java.io.tmpdir}
  data:
    mongodb:
      host: localhost
      port: 27017
      database: docstore

server:
  port: 8184

eureka:
  instance:
    nonSecurePortEnabled: false
    securePortEnabled: true
    securePort: ${server.port}
    statusPageUrl: https://localhost:${server.port}/info
    healthCheckUrl: https://localhost:${server.port}/health
    homePageUrl: https://localhost:${server.port}

msr:
  security:
    oauth2:
      enabled: true
      issuers: https://localhost:8443/auth/realms/HDFC,https://localhost:8443/auth/realms/BAJAJFIN,https://localhost:8443/auth/realms/MSR

springdoc:
  swagger-ui:
    oauth:
      clientId: lending_swagger
      clientSecret: f6fa4c15-772a-445a-b7b6-b63992aad8e8
      #user: swagger_dsa, swagger_dsa
  oAuthFlow:
    authorizationUrl: https://localhost:8443/auth/realms/MSR/protocol/openid-connect/auth
    tokenUrl: https://localhost:8443/auth/realms/MSR/protocol/openid-connect/token

logging:
  level:
    root: INFO
    com.msr.lending: DEBUG
    com.netflix.zuul: INFO
    com.msr.documents: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG

